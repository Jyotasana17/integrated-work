upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Increase body size for large OpenAPI spec uploads
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------
    # SSE: real-time scan event stream. Buffering MUST be off or live
    # progress updates appear frozen until the request completes. Long read
    # timeout keeps the long-lived connection open.
    # -------------------------------------------------
    location /api/v1/stream/ {
        proxy_pass              http://api_backend;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";

        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding off;
        gzip                    off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }

    # -------------------------------------------------
    # API: proxy all /api/v1/* and /metrics to FastAPI
    # -------------------------------------------------
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # CORS is handled by the FastAPI CORSMiddleware (driven by CORS_ORIGINS).
        # Do NOT add Access-Control-* headers here too, or browsers will see
        # duplicate values and reject the response.
    }

    location /health {
        proxy_pass http://api_backend/health;
    }

    location /metrics {
        proxy_pass http://api_backend/metrics;
        # In production, restrict this to internal monitoring IPs only
    }

    # -------------------------------------------------
    # Frontend: proxy everything else to Next.js
    # -------------------------------------------------
    location / {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
